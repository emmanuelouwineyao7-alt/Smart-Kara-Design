<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0066FF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Emblem Icon from High-Res PNG -->
  <image href="/images/logo_emblem.png" x="0" y="5" width="115" height="90" preserveAspectRatio="xMidYMid meet" />

  <!-- Vector Typography for SMART KARA DESIGN -->
  <g filter="url(#glow)">
    <!-- SMART -->
    <text 
      x="125" 
      y="50" 
      fill="#FFFFFF" 
      font-family="system-ui, -apple-system, 'Montserrat', 'Inter', 'Outfit', sans-serif" 
      font-weight="900" 
      font-size="40" 
      letter-spacing="2.5"
    >SMART</text>

    <!-- KARA DESIGN -->
    <text 
      x="126" 
      y="80" 
      fill="url(#blueGrad)" 
      font-family="system-ui, -apple-system, 'Montserrat', 'Inter', 'Outfit', sans-serif" 
      font-weight="800" 
      font-size="21" 
      letter-spacing="5.5"
    >KARA DESIGN</text>
  </g>
</svg>
